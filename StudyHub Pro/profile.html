<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân | StudyHub Pro</title>
    
    <meta name="theme-color" content="#050816">
    <link rel="icon" type="image/png" href="assets/icons/icon-192x192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/animation.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    
    <style>
        .profile-wrapper {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2rem;
            align-items: start;
        }

        .profile-avatar-card {
            padding: 2.5rem 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .avatar-edit-wrapper {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .profile-main-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--color-primary);
            box-shadow: var(--shadow-neon-primary);
        }

        .avatar-upload-label {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--color-secondary);
            border: 2px solid var(--text-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-fast);
            box-shadow: var(--shadow-neon-secondary);
        }

        .avatar-upload-label:hover {
            transform: scale(1.1);
            background: var(--color-primary);
            color: var(--bg-main);
            box-shadow: var(--shadow-neon-primary);
        }

        .profile-details-card {
            padding: 2.5rem;
        }

        .info-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 992px) {
            .profile-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="dashboard-body">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="dashboard.html" class="sidebar-logo">
                <i class="fa-solid fa-layer-group"></i> StudyHub
            </a>
        </div>
        <nav class="sidebar-menu">
            <div class="menu-label">Menu Chính</div>
            <a href="dashboard.html" class="menu-item">
                <i class="fa-solid fa-house"></i> <span>Tổng quan</span>
            </a>
            <a href="files.html" class="menu-item">
                <i class="fa-solid fa-folder-open"></i> <span>Tài liệu</span>
            </a>
            <a href="subjects.html" class="menu-item">
                <i class="fa-solid fa-book"></i> <span>Môn học</span>
            </a>
            <div id="roleMenuContainer"></div>
            <div class="menu-label">Cá nhân</div>
            <a href="profile.html" class="menu-item active">
                <i class="fa-solid fa-user"></i> <span>Hồ sơ</span>
            </a>
            <a href="settings.html" class="menu-item">
                <i class="fa-solid fa-gear"></i> <span>Cài đặt</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-mini">
                <img src="https://ui-avatars.com/api/?name=User" alt="Avatar" class="user-avatar" id="sidebarAvatar">
                <div class="user-info">
                    <div class="user-name" id="sidebarName">Đang tải...</div>
                    <div class="user-role" id="sidebarRole">role</div>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-layout">
        <header class="topbar">
            <div class="topbar-left">
                <h3 class="text-gradient-primary" style="font-weight: 700;">Hồ sơ của tôi</h3>
            </div>
            <div class="topbar-right">
                <button class="logout-btn" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                </button>
            </div>
        </header>

        <div class="main-content">
            <div class="profile-wrapper">
                
                <div class="glass-panel profile-avatar-card animate-fade-in-up mouse-light-wrapper">
                    <div class="mouse-light"></div>
                    <div class="avatar-edit-wrapper">
                        <img src="https://ui-avatars.com/api/?name=User" alt="Avatar lớn" class="profile-main-img" id="profileMainImg">
                        <label for="avatarFileInp" class="avatar-upload-label" title="Thay đổi hình đại diện">
                            <i class="fa-solid fa-camera"></i>
                        </label>
                        <input type="file" id="avatarFileInp" accept="image/*" style="display: none;">
                    </div>
                    <div>
                        <h3 id="profileDisplayName" style="font-size: 1.4rem; margin-bottom: 0.3rem;">Đang tải...</h3>
                        <span id="profileRoleBadge" class="btn btn-glass" style="padding: 0.2rem 0.8rem; font-size: 0.8rem; pointer-events: none; text-transform: uppercase; border-color: var(--color-primary); color: var(--color-primary);">Student</span>
                    </div>
                </div>

                <div class="glass-panel profile-details-card animate-slide-in-right mouse-light-wrapper">
                    <div class="mouse-light"></div>
                    <h3 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem;">Cập Nhật Thông Tin</h3>
                    
                    <form id="profileUpdateForm">
                        <div class="info-row">
                            <div class="input-group">
                                <label for="profileEmailInp">Địa chỉ Email (Không thể thay đổi)</label>
                                <input type="email" id="profileEmailInp" class="input-control" disabled style="background: rgba(0,0,0,0.4); border-color: transparent; color: var(--text-muted);">
                            </div>
                            <div class="input-group">
                                <label for="profileNameInp">Họ và Tên</label>
                                <input type="text" id="profileNameInp" class="input-control" required placeholder="Nhập họ tên đầy đủ">
                            </div>
                        </div>

                        <div class="info-row" style="margin-top: 1rem;">
                            <div class="input-group">
                                <label for="profileCreatedAtInp">Ngày tham gia mạng lưới</label>
                                <input type="text" id="profileCreatedAtInp" class="input-control" disabled style="background: rgba(0,0,0,0.4); border-color: transparent; color: var(--text-muted);">
                            </div>
                            <div class="input-group" style="visibility: hidden;">
                                </div>
                        </div>

                        <button type="submit" class="btn btn-primary ripple" style="margin-top: 2rem;">
                            <i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <script type="module" src="assets/js/utils.js"></script>
    <script type="module" src="assets/js/profile.js"></script>
    <script>
        // Hiệu ứng di chuyển ánh sáng nền 
        document.querySelectorAll('.mouse-light-wrapper').forEach(wrapper => {
            const light = wrapper.querySelector('.mouse-light');
            if(!light) return;
            wrapper.addEventListener('mousemove', (e) => {
                const rect = wrapper.getBoundingClientRect();
                light.style.left = `${e.clientX - rect.left}px`;
                light.style.top = `${e.clientY - rect.top}px`;
            });
        });
    </script>
</body>
</html>
