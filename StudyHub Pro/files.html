<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Tài Liệu Học Tập | StudyHub Pro</title>
    
    <meta name="theme-color" content="#050816">
    <link rel="icon" type="image/png" href="assets/icons/icon-192x192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/animation.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    
    <style>
        .filter-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: center;
        }

        .filter-select {
            min-width: 160px;
        }

        .search-large {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search-large input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-sm);
            color: var(--text-primary);
            outline: none;
            transition: var(--transition-normal);
        }

        .search-large input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 15px var(--color-primary-glow);
        }

        .search-large i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
    </style>
</head>
<body class="dashboard-body">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="dashboard.html" class="sidebar-logo">
                <i class="fa-solid fa-layer-group"></i> StudyHub
            </a>
        </div>
        <nav class="sidebar-menu">
            <div class="menu-label">Menu Chính</div>
            <a href="dashboard.html" class="menu-item">
                <i class="fa-solid fa-house"></i> <span>Tổng quan</span>
            </a>
            <a href="files.html" class="menu-item active">
                <i class="fa-solid fa-folder-open"></i> <span>Tài liệu</span>
            </a>
            <a href="subjects.html" class="menu-item">
                <i class="fa-solid fa-book"></i> <span>Môn học</span>
            </a>
            <div id="roleMenuContainer"></div>
            <div class="menu-label">Cá nhân</div>
            <a href="profile.html" class="menu-item">
                <i class="fa-solid fa-user"></i> <span>Hồ sơ</span>
            </a>
            <a href="settings.html" class="menu-item">
                <i class="fa-solid fa-gear"></i> <span>Cài đặt</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-mini">
                <img src="https://ui-avatars.com/api/?name=User" alt="Avatar" class="user-avatar" id="sidebarAvatar">
                <div class="user-info">
                    <div class="user-name" id="sidebarName">Đang tải...</div>
                    <div class="user-role" id="sidebarRole">role</div>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-layout">
        <header class="topbar">
            <div class="topbar-left">
                <h3 class="text-gradient-primary" style="font-weight: 700;">Thư Viện Tài Liệu Toàn Trường</h3>
            </div>
        </header>

        <div class="main-content">
            
            <div class="glass-panel filter-panel p-3 animate-fade-in-up">
                <div class="search-large">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="fileSearchInp" placeholder="Nhập từ khóa tìm kiếm tên tài liệu...">
                </div>
                
                <select id="filterSubject" class="input-control filter-select" style="background: var(--bg-main);">
                    <option value="all">Tất cả môn học</option>
                    <option value="math">Toán Học</option>
                    <option value="physics">Vật Lý</option>
                    <option value="chemistry">Hóa Học</option>
                    <option value="it">Tin Học</option>
                    <option value="english">Tiếng Anh</option>
                </select>

                <select id="filterGrade" class="input-control filter-select" style="background: var(--bg-main);">
                    <option value="all">Tất cả các khối</option>
                    <option value="10">Khối 10</option>
                    <option value="11">Khối 11</option>
                    <option value="12">Khối 12</option>
                    <option value="university">Đại học / Khác</option>
                </select>
            </div>

            <div class="files-grid" id="exploreFilesGrid">
                <div class="file-card glass-panel skeleton" style="height: 200px;"></div>
                <div class="file-card glass-panel skeleton" style="height: 200px;"></div>
                <div class="file-card glass-panel skeleton" style="height: 200px;"></div>
                <div class="file-card glass-panel skeleton" style="height: 200px;"></div>
            </div>

        </div>
    </main>

    <script type="module" src="assets/js/utils.js"></script>
    <script type="module" src="assets/js/files.js"></script>
</body>
</html>
