<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | StudyHub Pro</title>
    
    <meta name="theme-color" content="#050816">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/animation.css">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        /* Specific Styles cho Auth Pages */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 3rem 2rem;
            position: relative;
            z-index: 10;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-header .logo {
            font-size: 2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            text-decoration: none;
        }

        .auth-header .logo i {
            color: var(--color-primary);
        }

        .auth-header p {
            color: var(--text-secondary);
        }

        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .auth-footer a {
            font-weight: 600;
        }
        
        .social-login {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .social-login .btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
        }

        .social-login .btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-muted);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--glass-border);
        }

        .divider:not(:empty)::before {
            margin-right: .25em;
        }

        .divider:not(:empty)::after {
            margin-left: .25em;
        }

        /* Background Effects */
        .auth-bg-1 {
            position: absolute;
            top: -20%; left: -10%;
            width: 600px; height: 600px;
            background: var(--color-primary-glow);
            filter: blur(150px); border-radius: 50%;
        }
        .auth-bg-2 {
            position: absolute;
            bottom: -20%; right: -10%;
            width: 600px; height: 600px;
            background: var(--color-secondary-glow);
            filter: blur(150px); border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-bg-1"></div>
        <div class="auth-bg-2"></div>
        
        <div class="glass-panel auth-card animate-fade-in-up mouse-light-wrapper">
            <div class="mouse-light"></div>
            
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-layer-group"></i>
                    StudyHub <span class="text-gradient-primary">Pro</span>
                </a>
                <p>Chào mừng trở lại! Vui lòng đăng nhập để tiếp tục.</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                        <input type="email" id="email" class="input-control" style="padding-left: 2.8rem;" placeholder="nhap.email@truong.edu.vn" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password" style="display: flex; justify-content: space-between;">
                        Mật khẩu
                        <a href="forgot-password.html" style="font-size: 0.85rem;">Quên mật khẩu?</a>
                    </label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                        <input type="password" id="password" class="input-control" style="padding-left: 2.8rem;" placeholder="••••••••" required>
                        <i class="fa-solid fa-eye" id="togglePassword" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer;"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary ripple" style="width: 100%; margin-top: 1rem;">
                    <i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập
                </button>
            </form>

            <div class="divider">Hoặc</div>

            <div class="social-login">
                <button id="googleLoginBtn" class="btn ripple">
                    <i class="fa-brands fa-google" style="color: #ea4335;"></i> Google
                </button>
                <button id="githubLoginBtn" class="btn ripple">
                    <i class="fa-brands fa-github"></i> GitHub
                </button>
            </div>

            <div class="auth-footer">
                Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { showToast } from './assets/js/utils.js';
        
        // Toggle Password Visibility
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // Mouse Light
        const wrapper = document.querySelector('.mouse-light-wrapper');
        const light = document.querySelector('.mouse-light');
        wrapper.addEventListener('mousemove', (e) => {
            const rect = wrapper.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            light.style.left = `${x}px`;
            light.style.top = `${y}px`;
        });
    </script>
    
    <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
