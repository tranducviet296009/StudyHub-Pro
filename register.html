<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký | StudyHub Pro</title>
    
    <meta name="theme-color" content="#050816">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/animation.css">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        /* Tái sử dụng styles từ login.html */
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative; }
        .auth-card { width: 100%; max-width: 500px; padding: 3rem 2rem; position: relative; z-index: 10; }
        .auth-header { text-align: center; margin-bottom: 2rem; }
        .auth-header .logo { font-size: 2rem; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; text-decoration: none; }
        .auth-header .logo i { color: var(--color-primary); }
        .auth-header p { color: var(--text-secondary); }
        .auth-footer { margin-top: 2rem; text-align: center; font-size: 0.9rem; color: var(--text-secondary); }
        
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .role-option {
            position: relative;
        }

        .role-option input[type="radio"] {
            display: none;
        }

        .role-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem;
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-sm);
            background: rgba(0,0,0,0.2);
            cursor: pointer;
            transition: var(--transition-normal);
        }

        .role-card i {
            font-size: 1.5rem;
            color: var(--text-secondary);
        }

        .role-card span {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .role-option input[type="radio"]:checked + .role-card {
            border-color: var(--color-primary);
            background: rgba(0, 229, 255, 0.1);
            box-shadow: 0 0 10px var(--color-primary-glow);
        }

        .role-option input[type="radio"]:checked + .role-card i,
        .role-option input[type="radio"]:checked + .role-card span {
            color: var(--color-primary);
        }

        .auth-bg-1 { position: absolute; top: 10%; left: -10%; width: 500px; height: 500px; background: var(--color-secondary-glow); filter: blur(150px); border-radius: 50%; }
        .auth-bg-2 { position: absolute; bottom: 10%; right: -10%; width: 500px; height: 500px; background: var(--color-primary-glow); filter: blur(150px); border-radius: 50%; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-bg-1"></div>
        <div class="auth-bg-2"></div>
        
        <div class="glass-panel auth-card animate-fade-in-up mouse-light-wrapper">
            <div class="mouse-light"></div>
            
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-layer-group"></i>
                    StudyHub <span class="text-gradient-primary">Pro</span>
                </a>
                <p>Tạo tài khoản để tham gia cộng đồng học tập.</p>
            </div>

            <form id="registerForm">
                <label style="font-size: 0.9rem; font-weight: 500; color: var(--text-secondary); display: block; margin-bottom: 0.5rem;">Bạn là ai?</label>
                <div class="role-selector">
                    <label class="role-option">
                        <input type="radio" name="role" value="student" checked required>
                        <div class="role-card">
                            <i class="fa-solid fa-user-graduate"></i>
                            <span>Học Sinh</span>
                        </div>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="role" value="teacher">
                        <div class="role-card">
                            <i class="fa-solid fa-chalkboard-user"></i>
                            <span>Giáo Viên</span>
                        </div>
                    </label>
                </div>

                <div class="input-group">
                    <label for="fullname">Họ và Tên</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-user" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                        <input type="text" id="fullname" class="input-control" style="padding-left: 2.8rem;" placeholder="Nguyễn Văn A" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                        <input type="email" id="email" class="input-control" style="padding-left: 2.8rem;" placeholder="email@example.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                        <input type="password" id="password" class="input-control" style="padding-left: 2.8rem;" placeholder="Ít nhất 6 ký tự" required minlength="6">
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Xác nhận Mật khẩu</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-shield-check" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                        <input type="password" id="confirmPassword" class="input-control" style="padding-left: 2.8rem;" placeholder="Nhập lại mật khẩu" required minlength="6">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary ripple" style="width: 100%; margin-top: 1rem;">
                    <i class="fa-solid fa-user-plus"></i> Đăng Ký
                </button>
            </form>

            <div class="auth-footer">
                Đã có tài khoản? <a href="login.html">Đăng nhập</a>
            </div>
        </div>
    </div>

    <script type="module">
        const wrapper = document.querySelector('.mouse-light-wrapper');
        const light = document.querySelector('.mouse-light');
        if(wrapper && light) {
            wrapper.addEventListener('mousemove', (e) => {
                const rect = wrapper.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                light.style.left = `${x}px`;
                light.style.top = `${y}px`;
            });
        }
    </script>

    <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
